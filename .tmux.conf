set -g mouse on

# ==== Theme: Modern Neutrals ====
# palette: cream #e8e4dd, light gray #d6d6d4, greige #c7beb1,
#          taupe #b39c89, charcoal #2e2c31, blush #e5c9c0

# pane borders (thin, minimal — closest tmux can get to a floating look)
set -g pane-border-lines single
set -g pane-border-style fg=#c7beb1
set -g pane-active-border-style fg=#e8e4dd

# popups: Hyprland-style rounded floating windows (prefix + display-popup)
set -g popup-border-lines rounded
set -g popup-border-style fg=#e8e4dd
set -g popup-style bg=#2e2c31,fg=#e8e4dd

# status bar
set -g status on
set -g status-interval 5
set -g status-style bg=#2e2c31,fg=#e8e4dd
set -g status-left '#[bg=#b39c89,fg=#2e2c31,bold] #S #[bg=#2e2c31,fg=#b39c89]'
set -g status-left-length 30
set -g status-right '#[bg=#2e2c31,fg=#c7beb1] %a %d %b %Y #[bg=#b39c89,fg=#2e2c31,bold] %H:%M '
set -g status-right-length 60

# windows
set -g window-status-separator ''
set -g window-status-format '#[fg=#c7beb1] #I:#W '
set -g window-status-current-format '#[bg=#e8e4dd,fg=#2e2c31,bold] #I:#W #[bg=#2e2c31,fg=#e8e4dd]'

# messages
set -g message-style bg=#2e2c31,fg=#e8e4dd
set -g message-command-style bg=#2e2c31,fg=#e5c9c0

# Default 3-pane layout on new sessions:
#   top-left  : periodic fastfetch
#   top-right : myx
#   bottom    : shell (full width)
set-hook -g session-created 'split-window -v; split-window -h -t 0; select-pane -t 0; send-keys -t 1 "myx" Enter; send-keys -t 0 "while true; do clear; fastfetch; sleep 30; done" Enter'
