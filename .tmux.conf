set -g mouse on
set -g set-clipboard on
set -g mode-keys vi

# Right-click menu with paste from system clipboard
bind -T root MouseDown3Pane if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" \
  "select-pane -t= ; send -M" \
  "display-menu -t= -xM -yM -T \"#[align=centre]#{pane_index} (#{pane_id})\" \
    \"#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}\" < \"send -X history-top\" \
    \"#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}\" > \"send -X history-bottom\" \
    '' \
    \"#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}\" C-r \
      \"if -F \\\"#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}\\\" \\\"copy-mode -t=\\\" ; send -Xt= search-backward \\\"#{q:mouse_word}\\\"\" \
    \"#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}\" C-y \
      \"copy-mode -q ; send-keys -l -- \\\"#{q:mouse_word}\\\"\" \
    \"#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}\" c \
      \"copy-mode -q ; set-buffer -- \\\"#{q:mouse_word}\\\"\" \
    \"#{?mouse_line,Copy Line,}\" l \
      \"copy-mode -q ; set-buffer -- \\\"#{q:mouse_line}\\\"\" \
    '' \
    \"Paste\" p \"run-shell \\\"xclip -o -selection clipboard 2>/dev/null | tmux load-buffer - ; tmux paste-buffer\\\"\" \
    '' \
    \"Horizontal Split\" h \"split-window -h\" \
    \"Vertical Split\" v \"split-window -v\" \
    '' \
    \"Swap Up\" u \"swap-pane -U\" \
    \"Swap Down\" d \"swap-pane -D\" \
    '' \
    \"Kill\" X \"kill-pane\" \
    \"Respawn\" R \"respawn-pane -k\" \
    '' \
    \"#{?pane_marked,Unmark,Mark}\" m \"select-pane -m\" \
    \"#{?window_zoomed_flag,Unzoom,Zoom}\" z \"resize-pane -Z\""

# Pane borders
set -g pane-border-lines single
set -g pane-border-style fg=#c7beb1
set -g pane-active-border-style fg=#e8e4dd

# Status bar: Modern Neutrals
set -g status on
set -g status-interval 5
set -g status-style bg=#2e2c31,fg=#e8e4dd
set -g status-left '#[bg=#b39c89,fg=#2e2c31,bold] #S #[bg=#2e2c31,fg=#b39c89]'
set -g status-left-length 30
set -g status-right '#[bg=#2e2c31,fg=#c7beb1] %a %d %b %Y #[bg=#b39c89,fg=#2e2c31,bold] %H:%M '
set -g status-right-length 60

# Windows
set -g window-status-separator ''
set -g window-status-format '#[fg=#c7beb1] #I:#W '
set -g window-status-current-format '#[bg=#e8e4dd,fg=#2e2c31,bold] #I:#W #[bg=#2e2c31,fg=#e8e4dd]'

# Messages
set -g message-style bg=#2e2c31,fg=#e8e4dd
set -g message-command-style bg=#2e2c31,fg=#e5c9c0

# Copy to system clipboard + tmux buffer
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# 3-pane layout on new sessions
set-hook -g session-created 'split-window -v; split-window -h -t 0; send-keys -t 1 "myx" Enter; send-keys -t 0 "while true; do clear; fastfetch; sleep 30; done" Enter'